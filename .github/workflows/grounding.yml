name: Grounding regressions
on: [push, pull_request]
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pytest networkx python-dotenv
      - run: PYTHONPATH=backend python -m pytest backend/tests/unit -q
